<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePen з Emmet та eval()</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div class="editors-container">
        <div class="editor-box">
            <div class="editor-header">HTML</div>
            <textarea id="html-code" placeholder="Введіть HTML"></textarea>
        </div>

        <div class="editor-box">
            <div class="editor-header">CSS</div>
            <textarea id="css-code" placeholder="Введіть CSS"></textarea>
        </div>

        <div class="editor-box">
            <div class="editor-header">JavaScript</div>
            <textarea id="js-code" placeholder="Введіть JS код..."></textarea>
        </div>
    </div>

    <div class="preview-container">
        <iframe id="output"></iframe>
    </div>
    <script src="script.js"></script>
</body>
</html>
